<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky Seat</title>
<link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f4efe6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=1.1.4">
<script>try{var t=localStorage.getItem("ls-theme");if(t==="dark"||t==="light")document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<main aria-busy="true">
  <header class="top">
    <div><h1 id="judul"></h1><p class="sub" id="sub"></p></div>
    <div class="tools"><button type="button" class="btn-theme" data-theme-toggle aria-label="Dark mode"><svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg><svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div class="seg lang" role="group" data-i18n-aria="lang" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="id" aria-pressed="false">ID</button></div></div>
  </header>

  <article class="ticket">
    <div class="ticket-main">
      <div class="nav">
        <button id="prev" data-i18n-aria="prevDay" aria-label="Hari sebelumnya"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <div class="date"><small id="no"></small><span id="tglTxt"></span></div>
        <button id="next" data-i18n-aria="nextDay" aria-label="Hari berikutnya"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="who">
        <label class="label" for="nama" data-i18n="yourName">Nama kamu</label>
        <select id="nama"></select>
      </div>
      <div class="seat" id="seat" aria-live="polite">
        <div>
          <div class="eyebrow" data-i18n="seat">Kursi</div>
          <div class="num" id="num">00</div>
        </div>
        <div class="seat-act">
          <div class="msg" id="msg"></div>
          <button class="btn-draw" id="btnDraw" data-i18n="draw">Ambil nomor</button>
          <dl class="meta" id="meta">
            <div><dt data-i18n="mPos">Posisi</dt><dd id="mPos">--</dd></div>
            <div><dt data-i18n="mWkt">Diundi</dt><dd id="mWkt">--</dd></div>
            <div><dt data-i18n="mKode">Kode undian</dt><dd id="mKode" class="mono">----·----</dd></div>
          </dl>
        </div>
      </div>
      <div class="map" id="map" role="group" data-i18n-aria="mapLabel" aria-label="Seat map"></div>
      <p class="map-info" id="mapInfo" aria-live="polite"></p>
    </div>
    <div class="perf"></div>
    <div class="stub"><span class="ico"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span data-i18n="nextDraw">Undian berikutnya</span></span><b id="cd">--:--:--</b></div>
  </article>

  <div class="actions">
    <button class="btn-primary" id="btnShare">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.6-.3.3c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.7-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.2z"/></svg>
      <span data-i18n="shareList">Bagikan daftar ke grup WA</span>
    </button>
    <div class="links">
      <button class="btn-link" id="btnKartu"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/></svg><span data-i18n="shareCard">Bagikan kartu saya</span></button>
      <button class="btn-link" id="btnDl"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span data-i18n="saveJpg">Simpan JPG daftar</span></button>
    </div>
  </div>

  <section class="ticket list-card" aria-labelledby="listTitle">
    <div class="sec-head">
      <h2 id="listTitle" data-i18n="listTitle">Seat list</h2>
      <div class="seg" data-sort role="group" data-i18n-aria="sortBy" aria-label="Sort by">
        <button data-s="no" aria-pressed="true" data-i18n="sortNo">Number</button>
        <button data-s="nama" aria-pressed="false" data-i18n="sortName">Name</button>
      </div>
    </div>
    <ol id="daftar" class="seats"></ol>
  </section>

  <div class="alert info" role="note" aria-labelledby="aturanJudul">
    <svg class="alert-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
    <div class="alert-body">
      <p class="alert-title" id="aturanJudul" data-i18n="rulesTitle">Aturan kursi</p>
      <ul class="alert-list">
        <li id="aturan"></li>
        <li data-i18n="rule2">Sebisa mungkin tidak ada yang dapat kursi sama dengan hari kerja sebelumnya.</li>
        <li data-i18n="rule3">Tidak boleh tukar kursi tanpa alasan yang disetujui.</li>
      </ul>
    </div>
  </div>
  <div class="foot"><button id="btnUndang"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg><span data-i18n="copyInvite">Salin link undangan</span></button><a href="?admin"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span data-i18n="admin">Admin</span></a></div>
  <p class="ver" id="ver"></p>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="assets/js/version.js?v=1.1.4"></script>
<script src="config.js"></script>
<script src="assets/js/i18n.js?v=1.1.4"></script>
<script src="assets/js/sheet.js?v=1.1.4"></script>
<script src="assets/js/app.js?v=1.1.4"></script>
</body>
</html>
